services:
  nc_roomba_bridge:
    # Published multi-arch image (see .github/workflows/docker-bridge.yml).
    # Override with NC_ROOMBA_BRIDGE_IMAGE=...; `docker compose build` still
    # uses the local Dockerfile via the build: stanza.
    image: ${NC_ROOMBA_BRIDGE_IMAGE:-ghcr.io/vdroners/nc-roomba-bridge:latest}
    build: ./bridge
    container_name: nc_roomba_bridge
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      ROOMBA_MOCK: "${ROOMBA_MOCK:-1}"
      BLID: "${BLID:-}"
      PASSWORD: "${PASSWORD:-}"
      ROBOT_IP: "${ROBOT_IP:-}"
      ROBOT_NAME: "${ROBOT_NAME:-Roomba}"
      FIRMWARE_VERSION: "${FIRMWARE_VERSION:-2}"
      # Comma-separated /24 bases (or CIDR) to TCP-scan for :8883 when UDP misses.
      ROOMBA_DISCOVER_SUBNETS: "${ROOMBA_DISCOVER_SUBNETS:-192.168.1.0/24}"
      # Host Soft-AP helper (optional systemd unit on :8091).
      ROOMBA_WIFI_HELPER_URL: "${ROOMBA_WIFI_HELPER_URL:-http://host.docker.internal:8091}"
      ROOMBA_WIFI_HELPER_TOKEN: "${ROOMBA_WIFI_HELPER_TOKEN:-}"
      # Completed-mission journal, drained by Nextcloud via GET /missions.
      ROOMBA_MISSION_LOG: "/data/missions.json"
    volumes:
      - roomba_bridge_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Host loopback only for gates/debug — not LAN-public.
    ports:
      - "127.0.0.1:18791:8080"
    networks:
      nc-roomba-net:
        # Both spellings resolve so any saved bridge_url keeps working.
        aliases:
          - nc_roomba_bridge
          - nc-roomba-bridge

networks:
  nc-roomba-net:
    name: nc-roomba-net

volumes:
  roomba_bridge_data:
    name: nc_roomba_bridge_data
